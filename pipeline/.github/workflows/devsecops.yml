# Pipeline DevSecOps (Fase 5).
# NOTA: para activarlo en GitHub, copiar a la ruta .github/workflows/devsecops.yml
# en la raíz del repositorio. En local, usar `python pipeline/run_pipeline.py`.
name: devsecops-pipeline

on: [push, pull_request]

jobs:
  security-gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: SAST - Semgrep
        run: |
          pip install semgrep
          semgrep --config pipeline/semgrep-rules.yaml --error --quiet app/

      - name: SCA - pip-audit
        run: |
          pip install pip-audit
          pip-audit -r app/requirements.txt

      - name: Build de la imagen de la aplicacion
        run: docker build -f app/Dockerfile -t taller-waap/app:${{ github.sha }} .

      - name: Container scan - Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: taller-waap/app:${{ github.sha }}
          severity: "CRITICAL,HIGH"
          exit-code: "1"

      - name: IaC scan - Checkov
        uses: bridgecrewio/checkov-action@master
        with:
          file: app/Dockerfile,docker-compose.yml
          quiet: true

      - name: DAST - OWASP ZAP baseline
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: "http://localhost:4000"

      - name: Despliegue de reglas WAAP (solo si todo pasa)
        if: success()
        run: bash scripts/deploy_waap_rules.sh
